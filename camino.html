<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>葡萄牙朝聖之路｜Baiona → Santiago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Noto+Sans+TC:wght@400;600;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: paged pilgrim handbook — sticky tab nav + one panel per day; Atlantic-blue structure, yellow-arrow accent, stone neutrals */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
:root{
  --bg:#f6f2e9; --surface:#fffdf8; --ink:#241f1a; --muted:#6b6256; --line:#e3dac9;
  --sea:#1f5565; --sea-soft:#dcebee; --arrow:#e9a400; --arrow-ink:#8a5a00; --red:#a8402f;
  --shadow:0 1px 2px rgba(40,30,15,.06),0 6px 20px rgba(40,30,15,.06);
  --serif:"Fraunces","Noto Serif TC",Georgia,serif;
  --sans:"Noto Sans TC","Inter",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181b; --surface:#1f2024; --ink:#ece7dd; --muted:#9a9488; --line:#33343a;
  --sea:#6fc0d2; --sea-soft:#1c2e33; --arrow:#f0b623; --arrow-ink:#f0b623; --red:#e08972;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17181b; --surface:#1f2024; --ink:#ece7dd; --muted:#9a9488; --line:#33343a;
  --sea:#6fc0d2; --sea-soft:#1c2e33; --arrow:#f0b623; --arrow-ink:#f0b623; --red:#e08972;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased;letter-spacing:.01em}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;line-height:1.2}
a{color:var(--sea)}
.wrap{max-width:820px;margin:0 auto;
  padding-left:max(18px,env(safe-area-inset-left,0px));
  padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0}

/* masthead */
.mast{padding-block:26px 14px}
.mast .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--arrow-ink);font-weight:700}
.mast h1{font-size:clamp(1.7rem,6vw,2.5rem);margin:.25em 0 .05em}
.mast .route{font-family:var(--serif);font-style:italic;color:var(--sea);font-size:clamp(1rem,3.4vw,1.25rem);margin:0}

/* sticky tab nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);border-bottom:1px solid var(--line);
  margin:0 calc(-1*max(18px,env(safe-area-inset-left,0px))) 0;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;font-family:var(--sans);font-size:.82rem;font-weight:600;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;white-space:nowrap;
  transition:all .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--sea);color:#fff;border-color:var(--sea)}
:root[data-theme="dark"] .tabs button[aria-current="true"]{color:#12222a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-current="true"]{color:#12222a}}
.tabs button .km{font-weight:400;opacity:.8;font-size:.76rem}

/* panels */
main{padding-block:22px 40px;min-height:60vh}
.panel[hidden]{display:none!important}
.panel>.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--arrow-ink);font-weight:700}
.panel h2{font-size:1.55rem;margin:.15em 0 .1em}
.panel .route2{font-family:var(--serif);font-style:italic;color:var(--sea);font-size:1.1rem;margin:0 0 .2em}
.lead{color:var(--muted);max-width:52ch}

/* day stat strip */
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:16px 0}
.stat div{background:var(--surface);padding:11px 13px}
.stat dt{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat dd{margin:.2em 0 0;font-family:var(--serif);font-size:1.15rem;color:var(--sea);font-weight:600;font-variant-numeric:tabular-nums}
.stat dd small{font-size:.78rem;color:var(--muted);font-family:var(--sans);font-weight:400}

h3.blk{font-size:1.02rem;color:var(--sea);margin:22px 0 .2em;display:flex;align-items:center;gap:.45em}
h3.blk::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--arrow);display:inline-block}
.panel p{margin:.5em 0 0}
.panel ul{margin:.4em 0 0;padding-left:1.15em}
.panel li{margin:.25em 0}
.way{list-style:none;padding-left:0;margin:.5em 0 0}
.way li{display:flex;gap:.7em;padding:.2em 0;align-items:baseline}
.way .k{font-family:var(--serif);color:var(--arrow-ink);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:3.2em;font-size:.9rem}
.sleep{display:inline-block;margin-top:.7em;font-size:.84rem;background:var(--sea-soft);color:var(--sea);padding:3px 12px;border-radius:999px;font-weight:600}

.note{background:var(--sea-soft);border:1px solid var(--line);border-left:4px solid var(--sea);border-radius:12px;padding:14px 16px;margin:16px 0}
.note.warn{border-left-color:var(--red)}
.note h3{font-size:1rem;margin:0 0 .25em;color:var(--sea)}
.note.warn h3{color:var(--red)}
.note p,.note li{margin:.3em 0 0;font-size:.93rem}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:18px 0}
.facts div{background:var(--surface);padding:13px 15px}
.facts dt{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.facts dd{margin:.2em 0 0;font-family:var(--serif);font-size:1.25rem;color:var(--sea);font-weight:600;font-variant-numeric:tabular-nums}
.facts dd small{font-size:.78rem;color:var(--muted);font-family:var(--sans);font-weight:400}

.stages{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.stages th,.stages td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.stages th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stages td.km{font-family:var(--serif);color:var(--sea);font-weight:600;white-space:nowrap}
.stages td.d{color:var(--arrow-ink);font-weight:700;white-space:nowrap}
.stages tr.total td{border-top:2px solid var(--sea);border-bottom:none;font-weight:700}
.tablewrap{overflow-x:auto;margin-top:8px}

.cal{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:8px}
.cal th,.cal td{padding:7px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cal th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cal .dt{font-family:var(--serif);color:var(--sea);font-weight:600;white-space:nowrap}
.cal .off{color:var(--muted)}
.cal .lv{color:var(--red);font-weight:700;white-space:nowrap}
.cal tr.hol td{background:var(--sea-soft)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px;margin-top:8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
.box h3{font-size:1rem;margin:0 0 .3em;color:var(--sea)}
.box p,.box li{font-size:.9rem}
.box ul{margin:.3em 0 0;padding-left:1.1em}
.box .big{font-family:var(--serif);font-size:1.4rem;color:var(--sea);font-weight:600;font-variant-numeric:tabular-nums}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
.pager button{font-family:var(--sans);font-size:.85rem;font-weight:600;color:var(--sea);background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}
.buen{font-family:var(--serif);font-style:italic;color:var(--arrow-ink)}
.foot{color:var(--muted);font-size:.8rem;margin-top:26px;border-top:1px solid var(--line);padding-block:16px 36px}
.foot a{color:var(--sea)}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow">Caminho Português · Dual Pilgrim 🐚</div>
    <h1>葡萄牙朝聖之路</h1>
    <p class="route">Baiona → Santiago de Compostela ・ 最後 127 km</p>

  <nav><div class="tabs" id="tabs" role="tablist"></div></nav>

  <main id="main"></main>

  <footer class="foot">
    <p class="buen">¡Buen Camino! 一步一步,從大西洋海岸走到聖雅各的城。</p>
    <p>資料來源:<a href="https://santiagoways.com/en/stages-camino-portuguese-coastal-route/">Santiago Ways</a>、<a href="https://www.caminoninja.com/tips/last-100-kilometers-camino-de-santiago">Camino Ninja</a>、<a href="https://www.tb-kumano.jp/en/?p=234">田邊市熊野觀光局</a>、<a href="https://caminoways.com/camino-holy-year">Camino Ways 聖年</a>。距離為官方分段概值,實走略有出入。</p>
  </footer>
</div>

 {id:"cert", tab:"領證", html:`

 {id:"stay", tab:"住宿", html:`
   <div class="eyebrow">Where to stay · 7 人</div>
   <h2>住宿推薦</h2>
   <p class="lead">口碑與 CP 兼顧的選擇。聖年 + 7 人,房源緊、要早訂;實際評價以 Booking / Google 最新為準。</p>
   <div class="note warn"><h3>7 人房型配置</h3><p>每站約 <b>3 間雙人房 + 1 間單人房</b>,或 2 間三人房 + 1 單人。小旅館與 pensión 多可彈性安排;albergue 多為通鋪,適合想省的夜晚。<b>開訂就下手</b>,並請行李每日托運到下一站。</p></div>
   <div class="tablewrap"><table class="stages">
     <thead><tr><th>每晚</th><th>推薦(CP / 口碑)</th><th>升級選擇</th></tr></thead><tbody>
     <tr><td class="d">Baiona</td><td>Hospedaría Paso Pías / Hotel Carabela la Pinta<br><small style="color:var(--muted)">近海、價格親民</small></td><td>Parador de Baiona(城堡海景)</td></tr>
     <tr><td class="d">Vigo</td><td>Hotel Pantón<br><small style="color:var(--muted)">市中心、交通方便、CP 佳</small></td><td>市區四星任選</td></tr>
     <tr><td class="d">Arcade</td><td>Restaurante Isape<br><small style="color:var(--muted)">朝聖者常住、附餐;小鎮選擇少,務必最早訂</small></td><td>Vilaboa 一帶民宿</td></tr>
     <tr><td class="d">Pontevedra</td><td>Hotel Rúas<br><small style="color:var(--muted)">老城中心、經典 CP、步行逛街</small></td><td>Parador de Pontevedra(歷史建築)</td></tr>
     <tr><td class="d">Caldas de Reis</td><td>Hostal O Cruceiro<br><small style="color:var(--muted)">房間舒適、含衛浴、評價好</small></td><td>Torre do Río(河畔精品)</td></tr>
     <tr><td class="d">Padrón</td><td>Pensión Cuco<br><small style="color:var(--muted)">舒適含衛浴、CP 高</small></td><td>Hotel Scala(較大、好容 7 人)</td></tr>
     <tr><td class="d">Santiago</td><td>Hostal Giadas<br><small style="color:var(--muted)">近大教堂與老城、CP 佳</small></td><td>Pousadas de Compostela 系列 / San Francisco 修道院飯店</td></tr>
     </tbody></table></div>
   <div class="note"><p>想更省的夜晚,沿線都有公營/私營 <b>albergue</b>(每人約 €10–15,通鋪),可穿插安排;但 7 人同行想睡好、隔天有體力,建議以小旅館為主。</p></div>
 `},

 {id:"prep", tab:"行前", html:`
   <div class="eyebrow">Logistics</div>
   <h2>交通 · 住宿 · 裝備 · 費用</h2>
   <h3 class="blk">交通</h3>
   <div class="cols">
     <div class="box"><h3>去程 → 起點</h3><p>台灣無直飛,經杜哈/伊斯坦堡/曼谷轉機進 Porto(OPO)或 Vigo(VGO);再到 Vigo 搭 ATSA 巴士約 45 分到 Baiona。</p></div>
     <div class="box"><h3>回程 ← 終點</h3><p>由 Santiago 機場(SCQ)離開最順,經馬德里/里斯本或歐洲樞紐回台北。去 Finisterre 也從 Santiago 出巴士。</p></div>
     <div class="box"><h3>行李</h3><p>多數路段有行李托運,每日把大背包送到下一站旅館,白天只背水和點心。7 人同行更划算。</p></div>
   </div>
   <h3 class="blk">住宿 · 9 月 · 聖年</h3>
   <div class="cols">
     <div class="box"><h3>住宿風格(7 人)</h3><p>舒適取向:小旅館 / 鄉村民宿 / pensión。每站約 <b>3 間雙人 + 1 間單人</b>,或 2 間三人房 + 1 單人。詳見「住宿」頁。</p></div>
     <div class="box"><h3>9 月天氣</h3><p>加利西亞偏濕,白天約 18–25°C、早晚涼,隨時可能下雨;整體比盛夏舒服。建議挑 <b>9 月上–中旬</b>,越近月底雨機率略升。</p></div>
     <div class="box"><h3>聖年提醒</h3><p>2027 是 Xacobeo 聖年,朝聖者多,務必提早 3–6 個月把每一站訂好。</p></div>
   </div>
   <h3 class="blk">裝備</h3>
   <div class="cols">
     <div class="box"><h3>一定要帶</h3><ul>
       <li>credencial + <b>熊野蓋印單</b></li>
       <li>防水外套/輕雨衣、背包套</li>
       <li>已磨合健行鞋、備用鞋墊、水泡貼</li>
       <li>護照、歐元現金、旅平險</li></ul></div>
     <div class="box"><h3>身體準備</h3><p>你是跑馬+百岳的底子,體能綽綽有餘;重點是 <b>連續 6 天、每天 20+ km 的腳與鞋適應</b>。行前多走幾次 20 km 長程,把鞋穿到合腳。</p></div>
   </div>
   <h3 class="blk">粗估費用・每人</h3>
   <div class="cols">
     <div class="box"><h3>國際機票</h3><p class="big">NT$ 42,000–58,000</p><p>轉機;聖年旺季偏高,早訂省很多。</p></div>
     <div class="box"><h3>住宿 7–8 晚</h3><p class="big">NT$ 14,000–22,000</p><p>團體房型分攤,每人每晚約 €30–45。</p></div>
     <div class="box"><h3>餐食・交通・雜支</h3><p class="big">NT$ 12,000–18,000</p><p>套餐、巴士、行李托運、領證等。</p></div>
   </div>
   <div class="note"><p>合計約 <b>NT$ 68,000–98,000 / 人</b>(不含個人購物與延伸行程)。</p></div>
 `},

 {id:"tips", tab:"注意", html:`
   <div class="eyebrow">Before you go</div>
   <h2>總結注意事項</h2>
   <p class="lead">出發前把這頁從頭到尾看一遍,最關鍵的都在這裡。</p>
   <h3 class="blk">訂房與時程</h3>
   <ul>
     <li><b>2027 聖年 + 連假</b>:住宿提早 3–6 個月訂,熱門站(Pontevedra、Padrón)尤其早。</li>
     <li>西班牙 <b>晚餐很晚</b>(多在 20:00 後),朝聖者套餐(menú del peregrino)時間較早、份量足。</li>
     <li>小鎮午後常 <b>siesta 店休</b>、週日商店關門,補給趁早。</li>
   </ul>
   <h3 class="blk">證書規則(最重要)</h3>
   <ul>
     <li>全程帶 <b>credencial</b>;最後 100 km <b>每天蓋兩個章</b>,漏蓋會影響領證。</li>
     <li>Compostela 在 <b>Rúa Carretas 33</b> 領;雙朝聖在 <b>Rúa do Vilar 63</b> 登記。</li>
     <li><b>熊野蓋印單(含本宮印)一定要帶去西班牙。</b></li>
   </ul>
   <h3 class="blk">身體與裝備</h3>
   <ul>
     <li><b>雨具必帶</b>——加利西亞一年四季都可能下雨。</li>
     <li>鞋先磨合;<b>水泡預防勝於治療</b>,起熱點立刻處理。</li>
     <li>D1(26 km 柏油)、D6(26 km)最長:護膝、鞋墊;必要時可搭短程計程車跳過硬柏油段。</li>
   </ul>
   <h3 class="blk">路上</h3>
   <ul>
     <li>跟著 <b>黃箭頭 + 貝殼</b>走,岔路看箭頭就對。</li>
     <li>見人招呼「<b>Buen Camino</b>」。</li>
     <li>帶 <b>歐元現金</b>(小鎮蓋章、小店、泉水投幣)。</li>
   </ul>
   <h3 class="blk">安全 · 抵達</h3>
   <ul>
     <li>辦好 <b>旅平險</b>;歐洲緊急電話 <b>112</b>。</li>
     <li>抵 Santiago <b>一早先排領證</b>,再安排彌撒與老城。</li>
     <li><b>botafumeiro 不是每天擺盪</b>,想看先查當日場次。</li>
   </ul>
   <div class="note warn"><h3>一句話</h3><p>聖年早訂房、雨具不離身、每天兩個章、熊野印單帶著——其他交給雙腳。</p></div>
 `},
];

const main=document.getElementById("main"), tabsEl=document.getElementById("tabs");

function dayHTML(p){
  const wl = p.way.map(w=>`<li><span class="k">${w[0]}</span><span>${w[1]}</span></li>`).join("");
  return `
   <div class="eyebrow">${p.tab} · ${p.type}　徒步</div>
   <h2>${p.route}</h2>
   <dl class="stat">
     <div><dt>距離</dt><dd>${p.dist.replace(' km','')}<small> km</small></dd></div>
     <div><dt>時間</dt><dd style="font-size:1rem">${p.time}</dd></div>
     <div><dt>地形</dt><dd style="font-size:.95rem">${p.terrain}</dd></div>
     <div><dt>住宿</dt><dd style="font-size:1rem">${p.sleep}</dd></div>
   </dl>
   <h3 class="blk">路線重點</h3>
   <ul class="way">${wl}</ul>
   <h3 class="blk">看點</h3><p>${p.see}</p>
   <h3 class="blk">餐食・補給</h3><p>${p.eat}</p>
   <div class="note warn"><h3>今日注意</h3><p>${p.warn}</p></div>
   <span class="sleep">宿 · ${p.sleep}</span>`;
}

PAGES.forEach((p)=>{
  const b=document.createElement("button");
  b.type="button"; b.textContent=p.tab; b.dataset.id=p.id; b.setAttribute("role","tab");
  if(p.km) b.innerHTML=`${p.tab} <span class="km">${p.km}k</span>`;
  b.addEventListener("click",()=>{location.hash=p.id;});
  tabsEl.appendChild(b);
});

function pagerHTML(p){
  const i=PAGES.indexOf(p), prev=PAGES[i-1], next=PAGES[i+1];
  return `<div class="pager">
    <button ${prev?`data-go="${prev.id}"`:"disabled"}>← ${prev?prev.tab:""}</button>
    <button ${next?`data-go="${next.id}"`:"disabled"}>${next?next.tab:""} →</button></div>`;
}
function show(id){
  const p = PAGES.find(x=>x.id===id) || PAGES[0];
  main.innerHTML = `<section class="panel" tabindex="-1">${ p.html ? p.html : dayHTML(p) }${pagerHTML(p)}</section>`;
  Array.from(tabsEl.children).forEach(b=>b.setAttribute("aria-current", b.dataset.id===p.id ? "true":"false"));
  const cur=tabsEl.querySelector('[aria-current="true"]'); if(cur) cur.scrollIntoView({inline:"center",block:"nearest"});
  main.querySelector(".panel").focus({preventScroll:true});
  document.querySelectorAll(".pager button").forEach(btn=>btn.addEventListener("click",e=>{location.hash=e.currentTarget.dataset.go;}));
}
function route(){ const id=(location.hash||"#home").slice(1); show(id); }
window.addEventListener("hashchange",route);
route();
</script>
